# Mockery v2 configuration. Run with `go generate ./...`.
with-expecter: true
disable-version-string: true
filename: "mock_{{.InterfaceName}}.go"
mockname: "Mock{{.InterfaceName}}"
outpkg: mocks
dir: "{{.InterfaceDir}}/mocks"
packages:
  functiond/pkg/orchestration:
    config:
      all: true
  functiond/pkg/orchestration/pool:
    config:
      all: true
  functiond/pkg/runner/worker:
    config:
      all: true
